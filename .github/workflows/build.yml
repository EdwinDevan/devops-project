name: Java Maven CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, local-vm]

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Build and Package with Maven
      run: |
        echo "Running Maven clean package build..."
        mvn clean package

    - name: Deploy Compiled JAR to Background
      run: |
        echo "Stopping any stale Java web server instances running on port 8080..."
        sudo killall java || true
        
        echo "Deploying the freshly built Maven artifact..."
        # Running via classpath (-cp) ensures Java discovers App class at the root level of the artifact
        nohup java -cp target/devops-web-app-1.0-SNAPSHOT.jar App > app.log 2>&1 &
        
        echo "Waiting for web engine to initialize..."
        sleep 3
