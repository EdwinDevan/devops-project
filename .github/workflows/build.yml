name: Java Maven CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, local-vm]

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Build and Package with Maven
      run: |
        echo "Running Maven clean build..."
        mvn clean package

    - name: Deploy Compiled JAR to Background
      run: |
        echo "Stopping any stale Java web server instances..."
        sudo killall java || true
        
        echo "Deploying the freshly built Maven artifact..."
        # Maven automatically creates a 'target' directory with our executable JAR
        nohup java -jar target/devops-web-app-1.0-SNAPSHOT.jar > app.log 2>&1 &
        
        echo "Waiting for web engine to initialize..."
        sleep 3
